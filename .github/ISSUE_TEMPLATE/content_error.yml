name: Content error
description: Something in a lesson, reflection or the syllabus is wrong or unclear.
labels: ["content"]
body:
  - type: input
    id: day
    attributes:
      label: Day
      placeholder: "e.g. 18"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is wrong or unclear?
      description: Quote the sentence or link the line if you can.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: What would be correct or clearer?
